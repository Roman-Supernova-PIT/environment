# This the config for the NOV2025 SNPIT pipeline run if you're running
# on NERSC *not* inside a container.
#
# This is for use with the environment on NERSC you can activate with:
#
#   source /global/cfs/cdirs/m4385/env/setup_roman_snpit.sh
#
# To use this, you must first set up a secrets file with the database
# password, and a temp directory.  See the README file at
#
#   https://github.com/Roman-Supernova-PIT/environment
#
# for instructions (go to section "On NERSC").

system:
  db:
    url: https://c3-sn.lbl.gov/roman_snpit_nov2025
    username: ou2024nov
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    passwordfile: ${HOME}/secrets/roman_snpit_ou2024_nov_ou2024nov

  paths:
    data_dir: /pscratch/sd/m/masao/roman_snpit/database_dirs
    temp_dir: ${SCRATCH}/snpit_temp

    spectra1d: ${system.paths.data_dir}/spectra1d
    lightcurves: ${system.paths.data_dir}/lightcurves
    segmaps: ${system.paths.data_dir}/segmaps
    images: ${system.paths.data_dir}/images

    snappl:
      A25ePSF_path: /dvs_ro/cfs/cdirs/m4385/calib_data/A25ePSF

  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS
    config_file: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS/tds.yaml
    sn_truth_dir: /dvs_ro/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC/PQ+HDF5_ROMAN+LSST_LARGE
    images: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS/images/simple_model
    sims_sed_library: /dvs_ro/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC/sims_sed_library
