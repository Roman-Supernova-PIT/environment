# This the config for the NOV2025 SNPIT pipeline run if you're running
# on NERSC *not* inside a container.
#
# This is for use with the environment on NERSC you can activate with:
#
#   source /global/cfs/cdirs/m4385/env/setup_roman_snpit.sh
#
# NEEDED SETUP
#
# First, make yourself a temporary directory:
#
#    mkdir $SCRATCH/snpit_temp#
#
# Next, you will need to create a secrets directory under your
# home directory and put the database password
#
#   cd $HOME
#   mkdir secrets
#   chmod 710 secrets
#   setfacl -Rdm g::x,o::- secrets
#   cat > secrets/roman_snpit_ou2024_nov_ou2024nov
#   <paste the password you got from Rob here>
#
# After you've done that, hit CTRL-D and you should be back at the shell
# prompt.
#
# IF YOU HAVE YOUR OWN CONFIG FILE
#
# If you have additional configuration variables you need set, then
# create your own config file.  Set the env var SNPIT_CONFIG to
# point to that file.  At the top of that file, add:
#
#   preloads:
#     - /dvs_ro/cfs/cdirs/m4385/env/configs/nov2025_nersc_native_config.yaml

system:
  db:
    url: https://c3-sn.lbl.gov/roman_snpit_nov2025
    username: ou2024nov
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    passwordfile: ${HOME}/secrets/roman_snpit_ou2024_nov_ou2024nov

  paths:
    spectra1d: /pscratch/sd/m/masao/roman_snpit/database_dirs/spectra1d
    lightcurves: /pscratch/sd/m/masao/roman_snpit/database_dirs/lightcurves
    segmaps: /pscratch/sd/m/masao/roman_snpit/database_dirs/segmaps
    images: /pscratch/sd/m/masao/roman_snpit/database_dirs/images

    temp_dir: ${SCRATCH}/snpit_temp

    snappl:
      A25ePSF_path: /dvs_ro/cfs/cdirs/m4385/calib_data/A25ePSF

  ou24:
    simdex_server: https://roman-desc-simdex.rknop.net
    tds_base: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS
    config_file: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS/tds.yaml
    sn_truth_dir: /dvs_ro/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC/PQ+HDF5_ROMAN+LSST_LARGE
    images: /dvs_ro/cfs/cdirs/lsst/shared/external/roman-desc-sims/Roman_data/RomanTDS/images/simple_model
    sims_sed_library: /dvs_ro/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC/sims_sed_library
