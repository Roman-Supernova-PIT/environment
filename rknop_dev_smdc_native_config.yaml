system:
  db:
    url: https://romansnpit-ou2024-smdc.lbl.gov
    username: dbuser
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    passwordfile: ${HOME}/secrets/roman_snpit_db_ou2024_smdc

  # NOTE TO MWV : these next paths are the things that we will
  #   write to as new things are created.  On NERSC, /data
  #   is mounted from:
  #      /pscratch/sd/m/masao/roman_snpit/<name_for_database>
  #   and /temp is mounted from:
  #      $PSCRATCH/snpit_temp
  #   (so is different for every user)
  paths:
    spectra1d: /mwv/put/the/right/path/here # /data/spectra1d
    lightcurves: /mwv/put/the/right/path/here # /data/lightcurves
    segmaps: /mwv/put/the/right/path/here # /data/segmaps
    images: /mwv/put/the/right/path/here # /data/images

    temp_dir: /mwv/put/the/right/path/here # /snpit_temp

    # NOTE TO MWV:
    #   I don't think we'll need these, but if we do, we'll have to get
    #   them copied over.
    snappl:
      A25ePSF_path: /dev/null # /a25epsf

  # NOTE TO MWV : to figure out all these paths, take a look at :
  #    https://github.com/Roman-Supernova-PIT/environment/blob/main/interactive-podman-ou2024.sh
  # See there where /ou2024 and /home/environment are mounted from on NERSC
  # Find the analog on SMDC
  # FOR THIS PARTICULAR DATABASE, these can probably all be /dev/null,
  #    since this database is not for ou2024!
  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: /mwv/put/the/right/path/here # /ou2024/RomanTDS
    config_file: /mwv/put/the/right/path/here # /home/environment/ou2024_tds.yaml
    sn_truth_dir: /mwv/put/the/right/path/here # /ou2024_snana
    images: /mwv/put/the/right/path/here # /ou2024/RomanTDS/images/simple_model
    sims_sed_library: /mwv/put/the/right/path/here # /ou2024_sims_sed_library

