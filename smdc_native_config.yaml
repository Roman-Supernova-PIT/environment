system:
  db:
    url: https://romansnpit-ricksim-smdc.lbl.gov
    username: dbuser
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    passwordfile: ${HOME}/secrets/roman_snpit_db_ricksim_smdc

  paths:
    # These paths are not yet set up on SDMC
    spectra1d: /mnt/roman-science-internal/snpit/database_dirs/ricksims_2026-08/spectra1d
    lightcurves: /mnt/roman-science-internal/snpit/database_dirs/ricksims_2026-08/lightcurves
    segmaps: /mnt/roman-science-internal/snpit/database_dirs/ricksims_2026-08/segmaps
    images: /mnt/roman-science-internal/snpit/database_dirs/ricksims_2026-08/images

    temp_dir: /mnt/roman-science-internal/snpit/users/${LOGNAME}/temp_dir
    dev_storage: ${DEV_STORAGE}

    snappl:
      A25ePSF_path: /data/snpit/a25epsf

# /data/snpit/ou2024 is a mount point that a _user_ uses mount-s3 to mount the S3 bucket 
# The sn_truth_dir and sims_sed_library are not set up yet on SMDC
  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: /dev/null
    config_file: /data/snpit/env/configs/ou2024_tds.yaml
    sn_truth_dir: /dev/null
    images: /dev/null
    sims_sed_library: /dev/null
