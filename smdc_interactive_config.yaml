system:
  db:
    url: https://romansnpit-rknop-dev.lbl.gov
    username: dbuser
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    # This needs to be generalized and I'm not sure how yet (MWV, 2026-07-30)
    passwordfile: /home/wmwoodvasey/secrets/roman_snpit_db_rknop_dev

# These paths are not yet set up on SDMC
  paths:
    spectra1d: /data/snpit/spectra1d
    lightcurves: /data/snpit/lightcurves
    segmaps: /data/snpit/segmaps
    images: /data/snpit/images

    temp_dir: /dev/shm

    snappl:
      A25ePSF_path: /data/snpit/a25epsf

# /data/snpit/ou2024 is a mount point that a _user_ uses mount-s3 to mount the S3 bucket 
# The sn_truth_dir and sims_sed_library are not set up yet on SMDC
  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: /data/snpit/ou2024
    config_file: /data/snpit/environment/ou2024_tds.yaml
    sn_truth_dir: /data/snpit/ou2024_snana
    images: /data/snpit/ou2024/images/simple_model
    sims_sed_library: /data/snpit/ou2024_sims_sed_library
