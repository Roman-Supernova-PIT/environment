# This is intended to be a standalone docker test environment that can
# run locally, or on github CI.  It has a backend database and database
# web server running, based on the current main of roman-snpit-db
#
# Call the directory where you checked out the environment git repo the
# "base" directory.
#
# FOR THIS TO WORK:
#  * You must have checked out the environment repo in the base directory
#
#  * the following docker images must exist in the expected docker repositories:
#       snpit-db-postgres:{version}
#       snpit-db-webserver-test:{version}
#    where {version} is *either* the defaults in the image: fields below,
#    or the env var DOCKER_COMPOSE when you run the docker compose.
#    The "expected docker repositories" is by default
#    ghcr.io/roman-supernova-pit, but you can change that with the env var DOCKER_ARCHIVE.
#
#  * Then, in base/environment/test-docker-environment just run
#      docker compose up -d webserver shell.
#
# It mounts the base to /home, so if you need to have
# other subdirectories for your test, check them out in base directory and make sure to use
# /home/<whatever> inside the container.  For instance, if you're running snpit_utils
# tests, make sure to checkout the version you want of snpit_utils
# and then inside the container use /home/snpit_utils
#
# It will pull the roman-snpit-env environment from
#    ${ENV_DOCKER_ARCHIVE}/roman-snpit-env:${WHICHENV}
# ENV_DOCKER_ARCHIVE defaults to registry.nersc.gov/m4385/rknop
# WHICHENV defaults to cpu, and will usually be one of cpu, cpu-dev, cuda, or cuda-dev

services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
        - "8025:8025"

  postgres:
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-postgres:${DOCKER_VERSION:-test20250819}
    build:
      context: ../../roman-snpit-db/docker/postgres
      target: postgres
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postrgresql/data
      - type: bind
        source: secrets
        target: /secrets
        read_only: true
    healthcheck:
      test: netcat -w 1 localhost 5432 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

  createdb:
    depends_on:
      postgres:
        condition: service_healthy
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-webserver-test:${DOCKER_VERSION:-test20250819}
    build:
      context: ../../roman-snpit-db/
      dockerfile: docker/webserver/Dockerfile
      target: test
    environment:
      - SNPIT_CONFIG=/roman-snpit-db/config-test.yaml
    entrypoint:
      - python
      - -c
      - "import roman_snpit_db.migrations.apply_migrations as a; a.apply_migrations()"
    
  webserver:
    depends_on:
      createdb:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: netcat -w 1 localhost 8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-webserver-test:${DOCKER_VERSION:-test20250819}
    build:
      context: ../../roman-snpit-db/
      dockerfile: docker/webserver/Dockerfile
      target: test
    environment:
      - SNPIT_CONFIG=/roman-snpit-db/config-test.yaml
    ports:
      - "8080:8080"
    user: ${USERID:-0}:${GROUPID:-0}
      

  shell:
    image: ${ENV_DOCKER_ARCHIVE:-registry.nersc.gov/m4385/rknop}/roman-snpit-env:${WHICHENV:-cpu}
    volumes:
      - type: bind
        source: secrets
        target: /secrets
        read_only: true
      - type: bind
        source: ../../
        target: /home
    working_dir: /home
    command: tail -f /etc/issue


volumes:
  postgres_data:

