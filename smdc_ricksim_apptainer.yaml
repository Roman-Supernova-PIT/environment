system:
  db:
    url: https://romansnpit-ricksim-smdc.lbl.gov
    username: dbuser
    # LEAVE PASSWORD AS null.  Do NOT edit this field to put in a password!  Just use passwordfile
    password: null
    passwordfile: ${HOME}/secrets/roman_snpit_db_ricksim_smdc

  paths:
    spectra1d: /data/spectra1d
    lightcurves: /data/lightcurves
    segmaps: /data/segmaps
    images: /data/images

    temp_dir: /snpit_temp

    snappl:
      A25ePSF_path: /a25epsf

  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: /ou2024
    config_file: /snpit_env/environment/ou2024_tds.yaml
    sn_truth_dir: /ou2024_snana
    images: /ou2024/images/simple_model
    sims_sed_library: /ou2024_seds
